name: Rebuild dashboard

# Edit data/sales_data.xlsx (or the template), push to main,
# and this workflow regenerates index.html automatically.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "config.json"
      - "scripts/build.py"
      - "vendor/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/build.py
      - name: Commit rebuilt index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore: rebuild dashboard from latest Excel data" && git push)
